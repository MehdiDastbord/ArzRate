name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check source for unresolved merge conflicts
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' app/src app/build.gradle.kts; then
            echo "Merge conflict markers found in source."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArzRates-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
